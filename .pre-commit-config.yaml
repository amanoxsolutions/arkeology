repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff-format
        args: [--check]
        types_or: [python, pyi]
      - id: ruff
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies:
          - boto3-stubs[s3,bedrock-runtime,sts]
          - pydantic
          - pydantic-settings
          - types-boto3

  - repo: local
    hooks:
      - id: validate-skill-descriptions
        name: Validate SKILL.md description quoting
        language: system
        entry: python3 scripts/validate.py
        pass_filenames: false
        always_run: true
