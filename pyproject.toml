[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arkeology"
version = "0.6.0"
description = "MCP server for persistent artifact memory powered by AWS S3, S3 Vectors, and Bedrock embeddings"
requires-python = ">=3.14"
dependencies = [
    "fastmcp[apps]~=3.4",
    "boto3~=1.43",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "python-ulid~=3.1",
    "pyyaml~=6.0",
]

[project.scripts]
arkeology = "arkeology.__main__:main"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-mock~=3.15",
    "mypy~=2.1",
    "ruff~=0.15",
    "moto[s3]~=5.2",
    "boto3-stubs[s3,bedrock-runtime,sts,s3vectors]~=1.43",
    "pre-commit~=4.6",
    "types-pyyaml~=6.0",
    "mutmut~=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arkeology"]
include = ["src/arkeology/static/*"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.mutmut]
# `source_paths` must be the whole package, not just the files under test: mutmut copies
# these paths into a `mutants/` tree and runs pytest from there, so narrowing it to
# individual modules leaves the rest of the package missing and every conftest import
# fails with ModuleNotFoundError. Bound the scope with `only_mutate` instead.
source_paths = ["src/arkeology"]
# Bounded to AGENTS.md's declared mutation-testing Scope, which covers two invariants whose
# silent failure is unrecoverable: the cross-scope access gate, and the durable link-field read.
#
# `_scope.py` holds every implementation of the gate, in both of the forms it takes:
# `is_cross_scope_readable` (the in-process predicate, applied to a candidate already
# fetched — the read and delete paths) and `build_scope_filter` (the same rule as a
# server-side S3 Vectors filter, so foreign candidates are never fetched — the search,
# synthesise, and list paths). Keeping both here is what lets this list stay at two
# entries and still cover the whole declared Scope; a new gate implementation added
# outside `_scope.py` would silently fall out of mutation coverage.
#
# `_reference_filter.py` is listed for a different reason. It does *not* implement the
# gate — it delegates to `is_cross_scope_readable`. It is here because its own candidate
# loop can drop readable results independently of the gate's verdict, which is a defect
# class no amount of mutating `_scope.py` would reach.
#
# `only_mutate` accepts glob patterns only (`*` or `.py` suffix — see mutmut's
# `configuration.py`), so there is no way to narrow it to a single function. That is why
# gate logic belongs in a module small enough to mutate whole. Widening this list past
# the declared Scope is a convention change, not a config tweak.
# `annotations.py` is the second invariant, added 2026-09-06 when S3 object annotations became
# the sole source of truth for `commit_refs`/`references` (ADR-011, revision of 2026-09-05). The
# load-bearing rule there is that a failed annotation READ raises, while a genuinely absent
# annotation returns empty. Invert that distinction and every test can still pass while the
# read-modify-write paths — reconcile rebuilding vector metadata, an overwriting write, an archive
# restoring after its re-PUT — write an empty result back over good data. There is no second store
# to recover from any more, which is precisely why it belongs in this Scope.
only_mutate = [
    "src/arkeology/tools/_scope.py",
    "src/arkeology/tools/_reference_filter.py",
    "src/arkeology/annotations.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/", "-m", "not integration"]
# `test_skill_artifact_id_drift.py` reads SKILL.md files from `plugins/` relative to the
# repo root, which becomes `mutants/` during a run — without this it fails on a missing file.
also_copy = ["plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring real AWS credentials (deselect with '-m not integration')",
]
