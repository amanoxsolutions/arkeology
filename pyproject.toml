[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-mcp"
version = "0.1.0"
description = "MCP server for persistent artifact memory powered by AWS S3, S3 Vectors, and Bedrock embeddings"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "boto3>=1.38",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
cairn-mcp = "cairn_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.0",
    "mypy>=1.0",
    "ruff>=0.11",
    "moto[s3]>=5.2.1",
    "boto3-stubs[s3,bedrock-runtime,sts,s3vectors]>=1.38",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_mcp"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring real AWS credentials (deselect with '-m not integration')",
]
