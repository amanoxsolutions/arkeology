[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-mcp"
version = "0.4.0"
description = "MCP server for persistent artifact memory powered by AWS S3, S3 Vectors, and Bedrock embeddings"
requires-python = ">=3.14"
dependencies = [
    "fastmcp[apps]~=3.4",
    "boto3~=1.43",
    "pydantic~=2.13",
    "pydantic-settings~=2.14",
    "python-ulid~=3.1",
]

[project.scripts]
cairn-mcp = "cairn_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-mock~=3.15",
    "mypy~=2.1",
    "ruff~=0.15",
    "moto[s3]~=5.2",
    "boto3-stubs[s3,bedrock-runtime,sts,s3vectors]~=1.43",
    "pre-commit~=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_mcp"]
include = ["src/cairn_mcp/static/*"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring real AWS credentials (deselect with '-m not integration')",
]
